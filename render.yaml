services:
  - type: web
    name: grove-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./grove.db
      - key: CORS_ORIGINS
        value: https://grove-web-l57e.onrender.com

  - type: web
    name: grove-web
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://grove-api-u1xv.onrender.com
